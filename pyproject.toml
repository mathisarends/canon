[project]
name = "canon-workspace"
version = "0.0.0"
description = "Development workspace for the Canon FastAPI stack (not published)"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi-canon[streams,webrtc]==0.6.0",
    "fastapi-streams[codegen]==0.4.0",
    "fastapi-rpckit[codegen,dishka,otel]==0.3.0",
    "fastapi-webrtc[aiortc]==0.2.0",
    "fastapi-canon-reference",
]

[dependency-groups]
dev = ["packaging>=25", "pytest>=8.4.2", "pytest-asyncio>=1", "ruff>=0.12"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "examples/reference-service"]

[tool.uv.sources]
fastapi-canon = { workspace = true }
fastapi-streams = { workspace = true }
fastapi-rpckit = { workspace = true }
fastapi-webrtc = { workspace = true }
fastapi-canon-reference = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests/integration"]
addopts = ["--strict-config", "--strict-markers"]
