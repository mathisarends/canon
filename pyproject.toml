[project]
name = "fastapi-streams"
version = "0.1.0"
description = "Typed FastAPI streams with generated TypeScript and Python clients."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Mathis Arends" }]
dependencies = ["fastapi>=0.143.3,<1.0", "pydantic>=2.11,<3"]

[project.urls]
Documentation = "https://github.com/mathisarends/fastapi-streams/tree/main/docs"
Source = "https://github.com/mathisarends/fastapi-streams"
Issues = "https://github.com/mathisarends/fastapi-streams/issues"

[project.optional-dependencies]
codegen = ["jsonschema>=4.23,<5", "jinja2>=3.1,<4"]

[project.scripts]
fastapi-streams = "fastapi_streams.codegen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fastapi_streams"]

[dependency-groups]
test = [
  "httpx>=0.28", "pytest>=8.4.2", "pytest-asyncio>=1", "uvicorn>=0.35",
  "pyright>=1.1.400", "pytest-cov>=6",
]
dev = [
  { include-group = "test" },
  "jsonschema>=4.23,<5", "types-jsonschema>=4.23", "ruff>=0.12",
  "build>=1.2", "jinja2>=3.1,<4",
  "pylint>=4,<5",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["examples/agent_runs/generated_python", "tests/fixtures/generated_python"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["fastapi_streams", "examples", "tests/fixtures/generated_python"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pylint.main]
py-version = "3.12"
ignore-paths = ["fastapi_streams/codegen/templates/.*"]

[tool.pylint.messages_control]
# Ruff owns formatting and style; Pylint checks errors and warnings.
disable = ["C", "R"]

[tool.pylint.reports]
score = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["snapshot: golden schemas and clients tied to the locked dependencies"]

[tool.coverage.run]
branch = true
source = [
  "fastapi_streams",
  "examples.agent_runs.generated_python.runtime",
]
omit = ["*/codegen/templates/*"]

[tool.coverage.report]
show_missing = true
fail_under = 85

