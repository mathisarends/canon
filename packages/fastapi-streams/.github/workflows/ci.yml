name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.9.2"
          enable-cache: true
      - run: uv sync --frozen --all-extras
      - run: npm ci --ignore-scripts
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pylint fastapi_streams
      - run: uv run pre-commit run --all-files
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: uv run pytest -q --cov --cov-report=term-missing --cov-report=xml:coverage-python.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: coverage-python-${{ matrix.python }}
          path: |
            coverage-python.xml
            coverage-typescript.lcov
      - run: uv run python scripts/codegen.py --check
      - run: uv build
      - run: uv run --frozen twine check --strict dist/*
      - run: uv run python scripts/check_package.py
