[project]
name = "fastapi-webrtc"
version = "0.1.0"
description = "Typed WebRTC sessions for FastAPI with signaling, engines and generated browser clients"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
authors = [{ name = "Mathis Arends", email = "mathisarends27@gmail.com" }]
classifiers = [
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Conferencing",
    "Topic :: Multimedia :: Video",
    "Typing :: Typed",
]
dependencies = ["anyio>=4", "fastapi>=0.115,<1", "pydantic>=2.9,<3", "starlette>=0.41"]

[project.optional-dependencies]
aiortc = ["aiortc>=1.14,<2"]

[project.scripts]
fastapi-webrtc = "fastapi_webrtc.codegen.cli:main"

[project.urls]
Repository = "https://github.com/mathisarends/canon"
Source = "https://github.com/mathisarends/canon/tree/main/packages/fastapi-webrtc"
Documentation = "https://github.com/mathisarends/canon/tree/main/packages/fastapi-webrtc/docs"
Issues = "https://github.com/mathisarends/canon/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fastapi_webrtc"]

[tool.hatch.build.targets.sdist]
exclude = ["node_modules", "tests/typescript/dist", "tests/browser/dist"]

[dependency-groups]
dev = [
    "aiortc>=1.14,<2",
    "httpx>=0.28",
    "mypy>=1.15",
    "pytest>=8.4",
    "pytest-asyncio>=1",
    "pytest-cov>=6",
    "ruff>=0.12",
    "twine>=7,<8",
    "uvicorn>=0.35",
    "websockets>=15",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["node_modules"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["fastapi_webrtc", "tests", "examples"]
exclude = ["node_modules"]
pretty = true
show_error_codes = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["av", "av.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--strict-config", "--strict-markers"]
markers = ["engine: tests that need a real WebRTC engine (aiortc)"]
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]

[tool.coverage.run]
branch = true
source = ["fastapi_webrtc"]

[tool.coverage.report]
show_missing = true
fail_under = 85
