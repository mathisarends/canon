name: Streams compatibility

on:
  pull_request:
  push:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Streams (${{ matrix.streams }}, Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
        streams: [locked, upstream]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --all-groups
      - if: matrix.streams == 'upstream'
        run: >-
          uv pip install --upgrade
          "fastapi-streams[codegen] @ git+https://github.com/mathisarends/fastapi-streams.git@main"
      - name: Record versions and upstream revision
        run: uv pip freeze
      - name: Require the integration and codegen dependencies
        run: uv run --no-sync python -c "import fastapi_streams; import jinja2"
      # --no-sync keeps the upstream leg from reverting to the locked release.
      - run: uv run --no-sync pytest
